<script>
// One-time carry-over: up to version 1.1 the app ran at file://, so move.html hands the saved data over in the address.
if (location.hash.startsWith('#move=')) {
  try { const v = decodeURIComponent(location.hash.slice(6)); if (v && !localStorage.getItem('starhero')) localStorage.setItem('starhero', v); } catch (e) { /* nothing to carry */ }
  history.replaceState(null, '', location.pathname);
}
</script>
